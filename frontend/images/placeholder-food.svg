<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="50%" stop-color="#292524" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff5722" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ff5722" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7043" />
      <stop offset="100%" stop-color="#ff5722" />
    </linearGradient>
    <linearGradient id="bunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <circle cx="400" cy="270" r="240" fill="url(#glowGrad)" />

  <!-- Grill Lines Pattern -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="2">
    <line x1="100" y1="100" x2="700" y2="500" />
    <line x1="200" y1="100" x2="800" y2="500" />
    <line x1="0" y1="100" x2="600" y2="500" />
  </g>

  <!-- Stylized Burger & Cloche Icon -->
  <g filter="url(#shadow)" transform="translate(400, 260)">
    <!-- Top Bun -->
    <path d="M -110,-10 C -110,-85 110,-85 110,-10 C 110,-10 90,0 0,0 C -90,0 -110,-10 -110,-10 Z" fill="url(#bunGrad)" />
    <!-- Sesame Seeds -->
    <ellipse cx="-40" cy="-45" rx="3.5" ry="2" fill="#fef3c7" transform="rotate(-15 -40 -45)" />
    <ellipse cx="0" cy="-60" rx="3.5" ry="2" fill="#fef3c7" />
    <ellipse cx="40" cy="-45" rx="3.5" ry="2" fill="#fef3c7" transform="rotate(15 40 -45)" />
    <ellipse cx="-20" cy="-30" rx="3.5" ry="2" fill="#fef3c7" transform="rotate(10 -20 -30)" />
    <ellipse cx="25" cy="-28" rx="3.5" ry="2" fill="#fef3c7" transform="rotate(-10 25 -28)" />

    <!-- Lettuce Wave -->
    <path d="M -115,0 C -90,12 -70,2 -50,14 C -30,2 -10,14 10,2 C 30,14 50,2 70,14 C 90,2 115,12 115,0 L 110,-5 L -110,-5 Z" fill="#22c55e" />

    <!-- Melted Cheese -->
    <polygon points="-108,12 108,12 90,32 50,20 10,38 -30,18 -70,30 -100,18" fill="#eab308" />

    <!-- Juicy Patty -->
    <rect x="-110" y="22" width="220" height="28" rx="14" fill="#78350f" />

    <!-- Bottom Bun -->
    <rect x="-105" y="54" width="210" height="26" rx="12" fill="url(#bunGrad)" />
  </g>

  <!-- Steam / Fire Accents -->
  <g fill="none" stroke="url(#primaryGrad)" stroke-width="4" stroke-linecap="round" opacity="0.8">
    <path d="M 370,145 Q 360,120 375,95" />
    <path d="M 400,135 Q 415,110 400,85" />
    <path d="M 430,145 Q 440,120 425,95" />
  </g>

  <!-- Plate / Base Rim -->
  <ellipse cx="400" cy="370" rx="170" ry="16" fill="#000000" opacity="0.4" />
  <ellipse cx="400" cy="365" rx="150" ry="10" fill="none" stroke="#ff5722" stroke-width="2" opacity="0.3" />

  <!-- Brand Text -->
  <text x="400" y="440" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" letter-spacing="3" fill="#ffffff">
    SIZZLE<tspan fill="#ff5722">BITE</tspan>
  </text>
  <text x="400" y="475" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="14" letter-spacing="4" fill="#9ca3af" text-transform="uppercase">
    Fresh Off The Grill
  </text>
</svg>
